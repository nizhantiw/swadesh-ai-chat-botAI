# DigitalOcean App Platform Specification
# Deploy with: doctl apps create --spec .do/app.yaml
# Or connect via GitHub in DO dashboard

name: swadesh-ai-chat
region: blr  # Bangalore, change as needed

# ─── Database ─────────────────────────────────────────────────────────────────
databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database  # $7/month dev database
    num_nodes: 1

# ─── Backend Service ────────────────────────────────────────────────────────────
services:
  - name: backend
    github:
      repo: YOUR_GITHUB_USERNAME/swadesh-ai-chabot  # UPDATE THIS
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: |
      npm ci
      npm run build --workspace=@swadesh/shared
      npm run build --workspace=@swadesh/backend
    run_command: |
      cd apps/backend && npx drizzle-kit push && npx tsx src/db/seed.ts && node dist/index.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb  # $5/month
    http_port: 3000
    routes:
      - path: /api
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "3000"

# ─── Frontend Static Site ───────────────────────────────────────────────────────
static_sites:
  - name: frontend
    github:
      repo: YOUR_GITHUB_USERNAME/swadesh-ai-chabot  # UPDATE THIS
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: |
      npm ci
      npm run build --workspace=@swadesh/shared
      npm run build --workspace=@swadesh/frontend
    output_dir: apps/frontend/dist
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        scope: BUILD_TIME
        value: production

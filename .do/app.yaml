# DigitalOcean App Platform Specification
# Deploy by connecting GitHub repo in DO App Platform dashboard

name: swadesh-ai-chat
region: blr

# ─── Database ─────────────────────────────────────────────────────────────────
databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1

# ─── Backend Service ────────────────────────────────────────────────────────────
services:
  - name: backend
    github:
      repo: nizhantiw/swadesh-ai-chat-bot  # UPDATE to your repo
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 3000
    routes:
      - path: /api
        preserve_path_prefix: true
    build_command: npm ci && npm run build
    run_command: cd apps/backend && npx drizzle-kit push && node dist/index.js
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "3000"

# ─── Frontend Static Site ───────────────────────────────────────────────────────
static_sites:
  - name: frontend
    github:
      repo: nizhantiw/swadesh-ai-chat-bot  # UPDATE to your repo
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && npm run build
    output_dir: apps/frontend/dist
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        scope: BUILD_TIME
        value: production
